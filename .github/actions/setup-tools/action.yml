name: Setup Tools
description: Setup required tools in the workspace

runs:
  using: composite
  steps:
  - name: Setup Tools
    uses: egose/actions/asdf-tools@d0de96cd40ac3aa9b42cf7f6363bd374eced26e4

  - name: Install python tools
    run: |
      pip install -r requirements.txt
      asdf reshim
    shell: bash
