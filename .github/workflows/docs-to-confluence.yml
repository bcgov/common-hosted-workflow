name: Sync Docs to Confluence

on:
  workflow_dispatch:
  push:
    branches:
    - main
    paths:
    - docs/**
    - .github/workflows/docs-to-confluence.yml

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  docs-as-code:
    runs-on: ubuntu-latest
    environment: confluence
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

    - name: Setup Tools
      uses: ./.github/actions/setup-tools

    - name: Sync Docs to Confluence
      uses: egose/actions/confluence@e3f0eea78b2bd0b3cfe6b2b9eb6485b000cabfeb
      with:
        folder: docs
        username: ${{ secrets.CONFLUENCE_USERNAME }}
        api-token: ${{ secrets.CONFLUENCE_API_TOKEN }}
        confluence-base-url: ${{ vars.CONFLUENCE_BASE_URL }}
        space-key: ${{ vars.CONFLUENCE_SPACE_KEY }}
        parent-page-id: ${{ vars.CONFLUENCE_PARENT_PAGE_ID }}
        page-title-strategy: sentence-case-path
