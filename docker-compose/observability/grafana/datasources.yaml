# Docker-compose datasource provisioning.
# Helm/OpenShift equivalent: helm/main/values.yaml → grafana.datasources
# Keep in sync when adding or changing datasources.
#
# Port note: Mimir listens on 9009 here because the docker-compose observability
# stack uses the default Mimir HTTP port. The Helm subchart exposes 8080.
# The uid must stay "prometheus" in both environments — dashboards reference
# the datasource by uid, so a mismatch silently breaks all panel queries.
apiVersion: 1
datasources:
- name: Mimir
  type: prometheus
  uid: prometheus
  url: http://mimir:9009/prometheus
  isDefault: true
- name: Tempo
  type: tempo
  uid: tempo
  url: http://tempo:3200
  jsonData:
    nodeGraph:
      enabled: true
    traceQuery:
      timeShiftEnabled: true
      spanStartTimeShift: -15m
      spanEndTimeShift: 15m
- name: Loki
  type: loki
  uid: loki
  url: http://loki:3100
  isDefault: false
  # Streaming logs tenant — n8n log streaming.
  jsonData:
    httpHeaderName1: X-Scope-OrgID
  secureJsonData:
    httpHeaderValue1: streaming
- name: Loki System Logs
  type: loki
  uid: loki-system
  url: http://loki:3100
  isDefault: false
  # System logs tenant — pod stdout/stderr. Separate tenant enables a shorter
  # compactor retention period (6 months in prod) vs streaming logs (6 years).
  jsonData:
    httpHeaderName1: X-Scope-OrgID
  secureJsonData:
    httpHeaderValue1: system-logs
# Infinity datasource — used by dashboard variables to fetch the user's accessible
# projects and workflows from the n8n projects API endpoint.
# X-Grafana-Secret authenticates the request as coming from Grafana
# (validated against GRAFANA_PROJECTS_SECRET in external-hooks).
# oauthPassThru forwards the user's Keycloak Bearer token so the API can
# resolve the user's per-project access.
- name: n8n Projects
  type: yesoreyeram-infinity-datasource
  uid: n8n-projects
  # Base URL keeps variable queries environment-agnostic: they use relative paths (/rest/...)
  # and Infinity prepends this URL. Each environment overrides this via its own datasources config.
  url: http://n8n:5678
  jsonData:
    oauthPassThru: true
    auth_type: oauthPassthru
    httpHeaderName1: X-Grafana-Secret
    # allowedHosts forces Infinity to route requests through Grafana's backend plugin rather
    # than the browser. Without this, http://n8n:5678 is treated as a public/browser call
    # which can't reach Docker-internal addresses, and all queries silently return "No data".
    allowedHosts:
    - http://n8n:5678
  secureJsonData:
    httpHeaderValue1: $GRAFANA_PROJECTS_SECRET
