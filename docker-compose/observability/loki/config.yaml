auth_enabled: true

server:
  http_listen_port: 3100
  log_level: info

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

storage_config:
  aws:
    endpoint: http://seaweedfs:8333
    access_key_id: localuser
    secret_access_key: localdevkey # pragma: allowlist secret
    s3forcepathstyle: true
    insecure: true
    region: us-east-1
    bucketnames: local-loki-chunks
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index_cache

schema_config:
  configs:
  - from: '2026-08-04'
    store: tsdb
    object_store: s3
    schema: v13
    index:
      prefix: index_
      period: 24h

limits_config:
  reject_old_samples: false
  allow_structured_metadata: true
  retention_period: 30d
  max_query_length: 721h  # matches retention; prevents queries spanning beyond stored data

# Flush chunks to S3 quickly for local dev — default idle period is 30m.
ingester:
  chunk_idle_period: 2m
  max_chunk_age: 5m

compactor:
  working_directory: /tmp/loki-compactor   # /tmp avoids volume permission issues in docker
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: s3
