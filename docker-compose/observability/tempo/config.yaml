server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: s3
    s3:
      bucket: local-tempo-traces
      endpoint: seaweedfs:8333
      access_key: localuser
      secret_key: localdevkey # pragma: allowlist secret
      insecure: true
      forcepathstyle: true
    wal:
      path: /var/tempo/wal
