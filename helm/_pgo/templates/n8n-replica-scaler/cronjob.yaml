{{- if .Values.global.n8nReplicaScalerEnabled }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "_.fullname" . }}-replica-scaler
  labels:
    {{- include "_.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.n8nReplicaScaler.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # Stop a stuck Job after 2 minutes.
      activeDeadlineSeconds: 120
      # Don't retry failed Jobs; the next scheduled run will try again.
      backoffLimit: 0
      template:
        metadata:
          labels:
            {{- include "_.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: replica-scaler
        spec:
          serviceAccountName: {{ include "_.fullname" . }}-replica-scaler
          restartPolicy: Never
          volumes:
            - name: replica-scaler-script
              configMap:
                name: {{ include "_.fullname" . }}-replica-scaler-script
                defaultMode: 0755
          containers:
            - name: n8n-replica-scaler
              image: "{{ .Values.n8nReplicaScaler.image.repository }}:{{ .Values.n8nReplicaScaler.image.tag }}"
              imagePullPolicy: {{ .Values.n8nReplicaScaler.image.pullPolicy }}
              command: ["/bin/bash", "/scripts/scale.sh"]
              volumeMounts:
                - name: replica-scaler-script
                  mountPath: /scripts
              env:
                - name: DNS_PROBE_STATUS_URL
                  value: {{ .Values.n8nReplicaScaler.dnsProbStatusUrl | quote }}
                - name: SCALE_UP_STABILIZATION_SECONDS
                  value: {{ .Values.n8nReplicaScaler.scaleUpStabilizationSeconds | quote }}
                - name: SCALE_DOWN_STABILIZATION_SECONDS
                  value: {{ .Values.n8nReplicaScaler.scaleDownStabilizationSeconds | quote }}
                - name: DEPLOY_MAIN
                  value: {{ .Release.Name }}-n8n-main
                - name: DEPLOY_WORKER
                  value: {{ .Release.Name }}-n8n-worker
                - name: DEPLOY_WEBHOOK
                  value: {{ .Release.Name }}-n8n-webhook
                - name: DEPLOY_RUNNER
                  value: {{ .Release.Name }}-n8n-runner
                - name: STANDBY_MAIN
                  value: {{ .Values.n8nReplicaScaler.standby.main | quote }}
                - name: STANDBY_WORKER
                  value: {{ .Values.n8nReplicaScaler.standby.worker | quote }}
                - name: STANDBY_WEBHOOK
                  value: {{ .Values.n8nReplicaScaler.standby.webhook | quote }}
                - name: STANDBY_RUNNER
                  value: {{ .Values.n8nReplicaScaler.standby.runner | quote }}
                - name: ACTIVE_MAIN
                  value: {{ .Values.n8nReplicaScaler.active.main | quote }}
                - name: ACTIVE_WORKER
                  value: {{ .Values.n8nReplicaScaler.active.worker | quote }}
                - name: ACTIVE_WEBHOOK
                  value: {{ .Values.n8nReplicaScaler.active.webhook | quote }}
                - name: ACTIVE_RUNNER
                  value: {{ .Values.n8nReplicaScaler.active.runner | quote }}
              resources:
                requests:
                  cpu: 25m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
{{- end }}
