{{- if .Values.global.n8nReplicaScalerEnabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "_.fullname" . }}-replica-scaler
  labels:
    {{- include "_.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "_.fullname" . }}-replica-scaler
  labels:
    {{- include "_.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    resourceNames:
      - {{ .Release.Name }}-n8n-main
      - {{ .Release.Name }}-n8n-worker
      - {{ .Release.Name }}-n8n-webhook
      - {{ .Release.Name }}-n8n-runner
    # Allow the scaler to read and change the replica count
    # for the four n8n Deployments only.
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "_.fullname" . }}-replica-scaler
  labels:
    {{- include "_.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "_.fullname" . }}-replica-scaler
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "_.fullname" . }}-replica-scaler
{{- end }}
