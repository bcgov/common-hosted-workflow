apiVersion: 1

policies:
  - orgId: 1
    # grafana-default-email is Grafana's built-in receiver and always exists.
    # Since every alert rule carries a `team` label, all alerts are caught by
    # child routes and none reach the root receiver in practice.
    receiver: grafana-default-email
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: n8n-ops-email
        object_matchers:
          - [team, =, platform]
      - receiver: n8n-workflows-email
        object_matchers:
          - [team, =, workflows]
