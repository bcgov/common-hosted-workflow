apiVersion: 1

templates:
  - orgId: 1
    name: n8n.alert.subject
    template: |
      {{ define "n8n.alert.subject" }}{{ if eq .Status "firing" }}[FIRING]{{ else }}[RESOLVED]{{ end }} {{ (index .Alerts 0).Labels.alertname }} — {{ if eq (index .Alerts 0).Labels.team "workflows" }}n8n Workflows{{ else }}n8n Platform{{ end }}{{ end }}

  - orgId: 1
    name: n8n.alert.body
    template: |
      {{ define "n8n.alert.body" }}{{ range .Alerts -}}
      {{ if eq .Status "firing" }}{{ if eq .Labels.severity "critical" }}🔴 FIRING — Critical{{ else }}🟡 FIRING — Warning{{ end }}{{ else }}✅ RESOLVED{{ end }}

      {{ .Labels.alertname }}

      {{ .Annotations.summary }}

      Severity:    {{ .Labels.severity }}
      Service:     {{ .Labels.service }}
      Category:    {{ .Labels.category }}
      Team:        {{ .Labels.team }}
      Environment: {{ .Labels.environment }}
      Started:     {{ .StartsAt.UTC.Format "2006-01-02 15:04:05 UTC" }}{{ if eq .Status "resolved" }}
      Resolved:    {{ .EndsAt.UTC.Format "2006-01-02 15:04:05 UTC" }}{{ end }}

      What happened
      ────────────────────────────────────────────────────────
      {{ .Annotations.description }}
      {{ if eq .Labels.category "workflow" -}}
      {{ if .Annotations.workflow_failures }}
      Failed workflows
      ────────────────────────────────────────────────────────
      {{ .Annotations.workflow_failures }}
      {{ end -}}
      Review
      ────────────────────────────────────────────────────────
      📊 n8n Executions
      {{ $.ExternalURL }}d/n8n-executions/n8n-executions?from={{ with .StartsAt.UTC.Add -300000000000 }}{{ .UnixMilli }}{{ end }}&to={{ with .StartsAt.UTC.Add 300000000000 }}{{ .UnixMilli }}{{ end }}&refresh=30s
      {{ else if eq .Labels.category "infrastructure" -}}
      {{ if .Annotations.error_messages }}
      Recent errors
      {{ .Annotations.error_messages }}
      {{ end -}}
      Review
      ────────────────────────────────────────────────────────
      📊 n8n System Logs
      {{ $.ExternalURL }}d/n8n-system-logs/n8n-system-logs?from={{ with .StartsAt.UTC.Add -300000000000 }}{{ .UnixMilli }}{{ end }}&to={{ with .StartsAt.UTC.Add 300000000000 }}{{ .UnixMilli }}{{ end }}&refresh=30s
      {{ else -}}
      Review
      ────────────────────────────────────────────────────────
      📊 Dashboard
      {{ $.ExternalURL }}{{ .Annotations.dashboard_url }}
      {{ end }}
      {{ end }}{{ end }}
