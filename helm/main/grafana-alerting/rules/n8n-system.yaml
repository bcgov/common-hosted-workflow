apiVersion: 1

groups:
  - orgId: 1
    name: n8n System Log Alerts
    folder: n8n
    interval: 1m
    rules:

      # Fires when plain-text (unstructured) error lines appear in n8n pod logs.
      # Plain-text lines have level="" because n8n only sets level on JSON-structured logs.
      # Execution-lifecycle lines are excluded via the log_context stream label set by Alloy.
      # Catches: Redis/DB connection failures, startup crashes, runner panics.
      - uid: n8n-sys-log-errors
        title: "System Error Detected"
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'sum(count_over_time({job="n8n-system-logs", level="", log_context!="execution"} |~ "(?i)(error|exception|fatal|panic)" [5m]))'
              hide: false
              instant: true
              queryType: instant
              refId: A
          - refId: G
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'topk(10, sum by (error_line) (count_over_time({job="n8n-system-logs", level="", log_context!="execution"} |~ "(?i)(error|exception|fatal|panic)" | regexp "(?i)(?P<error_line>(?:error|exception|fatal|panic).{0,100})" [5m])))'
              hide: false
              instant: true
              queryType: instant
              refId: G
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: A
              hide: false
              refId: B
        noDataState: OK
        execErrState: Error
        for: 1m
        isPaused: false
        annotations:
          summary: "Infrastructure-level errors were detected in n8n pods."
          description: 'Unstructured error lines appeared in pod logs in the last 5 minutes. These catch Redis/database connection failures, startup crashes, and runner panics. Workflow node failures are excluded.'
          error_messages: '{{ range $k, $v := $values }}{{ if $v.Labels.error_line }}• {{ $v.Labels.error_line }}{{ "\n" }}{{ end }}{{ end }}'
        labels:
          category: infrastructure
          environment: __NAMESPACE__
          service: n8n
          severity: critical
          team: platform

      # Fires when JSON-structured errors appear from non-ErrorHandler modules.
      # ErrorHandler is n8n's HTTP layer for workflow node failures — not infrastructure.
      # Query G surfaces the top-5 distinct error messages in the email annotation.
      - uid: n8n-sys-log-json-errors
        title: "System Structured Error Detected"
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'sum(count_over_time({job="n8n-system-logs", level="error", log_context!="execution"} | module != "ErrorHandler" [5m]))'
              hide: false
              instant: true
              queryType: instant
              refId: A
          - refId: G
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'sum by (message) (count_over_time({job="n8n-system-logs", level="error", log_context!="execution", module!="ErrorHandler"} | json message | message != "" [5m]))'
              hide: false
              instant: true
              queryType: instant
              refId: G
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: A
              hide: false
              refId: B
        noDataState: OK
        execErrState: Error
        for: 1m
        isPaused: false
        annotations:
          summary: "JSON-structured errors were detected in n8n pods."
          description: 'Error-level log entries appeared from non-ErrorHandler modules in the last 5 minutes. These are application-level errors from infrastructure components such as the database, queue, or scheduler. Workflow node failures are excluded.'
          error_messages: '{{ range $k, $v := $values }}{{ if $v.Labels.message }}• {{ $v.Labels.message }}{{ "\n" }}{{ end }}{{ end }}'
        labels:
          category: infrastructure
          environment: __NAMESPACE__
          service: n8n
          severity: critical
          team: platform

      # Fires when warning volume is unusually high (>10 warn lines in 5 min).
      # Execution-lifecycle messages are excluded via the log_context stream label set by
      # Alloy. Only the two stable deprecation patterns remain as inline exclusions —
      # they fire on every pod restart and are expected until the storage migration runs.
      - uid: n8n-sys-log-warnings
        title: "System Warnings Elevated"
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: loki
            model:
              datasource:
                type: loki
                uid: loki
              editorMode: code
              expr: 'sum(count_over_time({job="n8n-system-logs", log_context!="execution"} | detected_level = "warn" !~ "(?i)(binaryData.*will be renamed|Use.*trace-deprecation)" [5m]))'
              hide: false
              instant: true
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [10]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              expression: A
              hide: false
              refId: B
        noDataState: OK
        execErrState: OK
        for: 5m
        isPaused: false
        annotations:
          summary: "Warning log volume is elevated in n8n pods."
          description: '{{ $values.B.Value | printf "%.0f" }} warning lines detected in the last 5 minutes (threshold: 10). A sustained spike often precedes errors — investigate before it escalates.'
        labels:
          category: infrastructure
          environment: __NAMESPACE__
          service: n8n
          severity: warning
          team: platform
