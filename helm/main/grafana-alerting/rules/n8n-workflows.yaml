apiVersion: 1

groups:
  - orgId: 1
    name: n8n Execution Alerts
    folder: n8n
    interval: 1m
    rules:

      # Fires as soon as any non-manual workflow execution fails.
      # Manual (editor test runs) are excluded via mode!="manual" so developers
      # can test without triggering pages. Webhook, trigger, integrated, and cli
      # executions are all treated as production traffic.
      - uid: n8n-workflow-failed
        title: "Workflow Execution Failed"
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 'sum by (workflow_name) (increase(n8n_workflow_failed_total{mode!="manual"}[5m]))'
              hide: false
              instant: true
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: classic_conditions
              datasource:
                type: __expr__
                uid: __expr__
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              refId: B
        noDataState: OK
        execErrState: Error
        for: 0s
        isPaused: false
        annotations:
          summary: "One or more production workflow executions failed."
          description: "Non-manual workflow executions failed in the last 5 minutes. Webhook, trigger, integrated, and CLI modes are monitored — editor test runs are excluded."
          workflow_failures: '{{ range $k, $v := $values }}{{ if $v.Labels.workflow_name }}• {{ $v.Labels.workflow_name }} ({{ $v.Value | printf "%.0f" }} failure(s)){{ "\n" }}{{ end }}{{ end }}'
        labels:
          category: workflow
          environment: __NAMESPACE__
          service: n8n
          severity: critical
          team: workflows
