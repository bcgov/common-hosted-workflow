{{- if .Values.grafana.enabled }}
{{- range $path, $_ := .Files.Glob "dashboards/*/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "_.fullname" $ }}-dashboard-{{ base $path | trimSuffix ".json" }}
  labels:
    {{- include "_.labels" $ | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    grafana_dashboard_folder: {{ $path | dir | base }}
data:
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
{{- end }}
