{{- if and .Values.alloy.enabled .Values.systemLogs.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "_.fullname" . }}-alloy
  labels:
    {{- include "_.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "_.fullname" . }}-alloy-pod-logs
  labels:
    {{- include "_.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "_.fullname" . }}-alloy-pod-logs
  labels:
    {{- include "_.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "_.fullname" . }}-alloy-pod-logs
subjects:
  - kind: ServiceAccount
    name: {{ include "_.fullname" . }}-alloy
    namespace: {{ .Release.Namespace }}
{{- end }}
