n8n:
  enabled: true
  env:
    WEBHOOK_URL: https://n8n.developer.gov.bc.ca
    N8N_SMTP_HOST: "apps.smtp.gov.bc.ca"
    N8N_SMTP_PORT: "25"
    N8N_SMTP_SSL: "false"
    N8N_SMTP_AUTHTYPE: "NONE"
    N8N_SMTP_USER: ""
    N8N_SMTP_PASS: ""
    N8N_SMTP_SENDER: "DoNotReplyCITZ@gov.bc.ca"
    N8N_BASE_URL: https://n8n.developer.gov.bc.ca
    OIDC_ISSUER: https://loginproxy.gov.bc.ca/auth/realms/standard
    AUTHZ_ENVIRONMENT: prod
    UI_OIDC_REDIS_PREFIX: "chwf:ui-oidc:prod:"
    CHEFS_BASE_URL: https://submit.digital.gov.bc.ca
    FEATURES_ENABLED: "workflow-share"
    N8N_DEFAULT_BINARY_DATA_MODE: "filesystem"
    N8N_EXECUTION_DATA_STORAGE_MODE: "default"

  extraExcludedNodes:
    - "n8n-nodes-base.scheduleTrigger"
    - "n8n-nodes-base.rabbitmqTrigger"
    - "n8n-nodes-base.mqttTrigger"
    - "n8n-nodes-base.amqpTrigger"
    - "n8n-nodes-base.kafkaTrigger"
    - "n8n-nodes-base.redisTrigger"
    - "n8n-nodes-base.emailReadImap"
    - "n8n-nodes-base.rssFeedReadTrigger"
    - "n8n-nodes-base.sseTrigger"
    - "n8n-nodes-base.postgresTrigger"

  route:
    enabled: true
    host: prod-chwf.apps.golddr.devops.gov.bc.ca

  main:
    deploymentStrategy:
      type: "RollingUpdate"

  worker:
    enabled: true

  webhook:
    enabled: true

  runner:
    enabled: true

pgo:
  enabled: true

  instance:
    dataVolumeClaimSpec:
      resources:
        requests:
          storage: 1Gi

  pgBackRest:
  conditionalRestore:
    enabled: true
    s3:
      bucket: workflow-prod/backups/pgdump

# backup-storage is intentionally disabled on GoldDR — backups are created on Gold only
backup-storage:
  enabled: false

redis:
  enabled: true
  master:
    persistence:
      size: 256Mi

dns-probe:
  enabled: true
  env:
    APP_ENV: "production"
