n8n:
  enabled: true
  env:
    WEBHOOK_URL: "https://test-chwf.apps.gold.devops.gov.bc.ca"
    N8N_SMTP_HOST: "apps.smtp.gov.bc.ca"
    N8N_SMTP_PORT: "25"
    N8N_SMTP_SSL: "false"
    N8N_SMTP_AUTHTYPE: "NONE"
    N8N_SMTP_USER: ""
    N8N_SMTP_PASS: ""
    N8N_SMTP_SENDER: "DoNotReplyCITZ@gov.bc.ca"
    N8N_BASE_URL: https://test-chwf.apps.gold.devops.gov.bc.ca
    OIDC_ISSUER: https://test.loginproxy.gov.bc.ca/auth/realms/standard
    UI_OIDC_REDIS_PREFIX: "chwf:ui-oidc:test:"
    AUTHZ_ENVIRONMENT: test
    CHEFS_BASE_URL: https://chefs-test.apps.silver.devops.gov.bc.ca
    FEATURES_ENABLED: "workflow-share"
    N8N_DEFAULT_BINARY_DATA_MODE: "filesystem"
    N8N_EXECUTION_DATA_STORAGE_MODE: "default"
    # n8n-sync publisher target (this instance is the source). Base URL only, no path.
    SYNC_SUBSCRIBER_URLS: "https://test-chwf-sync.apps.gold.devops.gov.bc.ca"

  persistence:
    size: 1Gi

  route:
    enabled: true
    host: test-chwf.apps.gold.devops.gov.bc.ca

  worker:
    enabled: true

  webhook:
    enabled: true

  runner:
    enabled: true

# NOTE: YAML anchors from values.yaml do not cross -f boundaries, so this
# repeats the small test delta explicitly. Base n8n-sync (fullname,
# DB secret, QUEUE_BULL_PREFIX=sync:) is inherited from values.yaml via
# Helm's deep merge.
n8n-sync:
  enabled: true
  env:
    WEBHOOK_URL: "https://test-chwf-sync.apps.gold.devops.gov.bc.ca"
    N8N_BASE_URL: https://test-chwf-sync.apps.gold.devops.gov.bc.ca
    OIDC_ISSUER: https://test.loginproxy.gov.bc.ca/auth/realms/standard
    UI_OIDC_REDIS_PREFIX: "chwf:ui-oidc-sync:test:"
    AUTHZ_ENVIRONMENT: test
    CHEFS_BASE_URL: https://chefs-test.apps.silver.devops.gov.bc.ca
    QUEUE_BULL_PREFIX: "sync:"
    SYNC_FILTER_BY_TAG: "true"

  persistence:
    size: 1Gi

  route:
    enabled: true
    host: test-chwf-sync.apps.gold.devops.gov.bc.ca

  worker:
    enabled: true

  webhook:
    enabled: true

  runner:
    enabled: true

redis:
  enabled: true

pgo:
  enabled: true
  pgBackRest:
    repos:
      - name: repo1
        retention:
          full: "2"
          fullType: count
        volume:
          volumeClaimSpec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 512Mi
            storageClassName: netapp-file-standard
        schedules:
          full: "0 3 * * 1-5"             # Full database refresh and log purge at 3:00 AM (Mon-Fri)
          incremental: "30 22 * * 1-5"    # Nightly automation/test sweep at 10:30 PM (Mon-Fri)
      - name: repo2
        secretName: chwf-pgo-s3 # pragma: allowlist secret
        retention:
          full: "30"
          fullType: time
        path: /backups/pgo
        uriStyle: path
        s3:
          bucket: workflow-test
          endpoint: commonservices.objectstore.gov.bc.ca
          region: ca-central-1
        schedules:
          full: "0 3 * * 1-5"             # Full database refresh and log purge at 3:00 AM (Mon-Fri)
          incremental: "30 22 * * 1-5"    # Nightly automation/test sweep at 10:30 PM (Mon-Fri)
backup-storage:
  enabled: true

  image:
    tag: "2.13.0"
    pullPolicy: IfNotPresent

  env:
    S3_BUCKET:
      value: workflow-test/backups/pgdump/

  backupConfig: |
    postgres=chwf-pgo-replicas:5432/n8n
    postgres=chwf-pgo-replicas:5432/n8n-custom
    postgres=chwf-pgo-replicas:5432/n8n-sync

    */10 * * * * default ./backup.sh -s
    0 3 * * 1-5 default ./backup.sh -s -v all
