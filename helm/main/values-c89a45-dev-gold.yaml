n8n:
  enabled: true
  env:
    WEBHOOK_URL: "https://dev-workflow.apps.gold.devops.gov.bc.ca"
    N8N_SMTP_HOST: "apps.smtp.gov.bc.ca"
    N8N_SMTP_PORT: "25"
    N8N_SMTP_SSL: "false"
    N8N_SMTP_AUTHTYPE: "NONE"
    N8N_SMTP_USER: ""
    N8N_SMTP_PASS: ""
    N8N_SMTP_SENDER: "DoNotReplyCITZ@gov.bc.ca"
    N8N_ENV_FEAT_ENCRYPTION_KEY_ROTATION: "true"
    N8N_BASE_URL: https://dev-workflow.apps.gold.devops.gov.bc.ca
    OIDC_ISSUER: https://dev.loginproxy.gov.bc.ca/auth/realms/standard
    UI_OIDC_REDIS_PREFIX: "chwf:ui-oidc:dev:"
    CHEFS_BASE_URL: https://chefs-dev.apps.silver.devops.gov.bc.ca
    FEATURES_ENABLED: "wil, project, workflow-share, tenant-project-sync"
    CSTAR_BASE_URL: https://dev.connect.digital.gov.bc.ca
    AUTHZ_ENVIRONMENT: dev
    N8N_OTEL_TRACES_PRODUCTION_ONLY: "false"  # trace all executions in dev, not just production triggers
    N8N_LICENSE_AUTO_RENEW_ENABLED: "true"
    N8N_EXTERNAL_STORAGE_S3_BUCKET_NAME: "workflow-dev"
    N8N_METRICS: "true"
    N8N_OTEL_ENABLED: "true"
    N8N_LOG_STREAMING_MANAGED_BY_ENV: "true"

  route:
    enabled: true
    host: dev-workflow.apps.gold.devops.gov.bc.ca

  worker:
    enabled: true

  webhook:
    enabled: true

  runner:
    enabled: true

postgresql:
  enabled: false

redis:
  enabled: true

pgo:
  enabled: true
  pgBackRest:
    repos:
      - name: repo1
        retention:
          full: "2"
          fullType: count
        volume:
          volumeClaimSpec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 512Mi
            storageClassName: netapp-file-standard
        schedules:
          full: 0 8 * * *
          incremental: 0 0,4,12,16,20 * * *

      - name: repo2
        secretName: chwf-pgo-s3 # pragma: allowlist secret
        retention:
          full: "30"
          fullType: time
        path: /backups/pgo/platform
        uriStyle: path
        s3:
          bucket: workflow-dev
          endpoint: commonservices.objectstore.gov.bc.ca
          region: ca-central-1
        schedules:
          full: "0 7 * * 1-5"             # Environment reset/cleanup at 7:00 AM before work starts (Mon-Fri)
          incremental: "0 9-17/2 * * 1-5" # Fast sync every 2 hours during working hours (Mon-Fri)

sdg-mock-app:
  enabled: true
  route:
    enabled: true
    host: dev-workflow-mock.apps.gold.devops.gov.bc.ca
  persistence:
    size: 512Mi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: 250m
      memory: 512Mi
      ephemeral-storage: 256Mi

loki:
  enabled: true
  loki:
    storage:
      bucketNames:
        chunks: dev-loki
        ruler: dev-loki-ruler
      s3:
        endpoint: http://chwf-seaweedfs-s3.c89a45-tools.svc.cluster.local:8333
    limits_config:
      retention_period: 720h  # 30 days
  singleBinary:
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

tempo:
  enabled: true
  tempo:
    retention: 720h  # 30 days
    storage:
      trace:
        s3:
          bucket: dev-tempo
          endpoint: chwf-seaweedfs-s3.c89a45-tools.svc.cluster.local:8333
    resources:
      requests:
        cpu: 10m
        memory: 256Mi
      limits:
        cpu: 250m
        memory: 768Mi

mimir:
  enabled: true
  storage:
    s3:
      endpoint: chwf-seaweedfs-s3.c89a45-tools.svc.cluster.local:8333
      blocksBucket: dev-mimir-blocks
      alertmanagerBucket: dev-mimir-alertmanager
      rulerBucket: dev-mimir-ruler
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

grafana:
  chwfRoute:
    enabled: true
    host: dev-grafana-workflow.apps.gold.devops.gov.bc.ca
  enabled: true
  grafana.ini:
    server:
      root_url: https://dev-grafana-workflow.apps.gold.devops.gov.bc.ca
    auth.generic_oauth:
      auth_url: https://dev.loginproxy.gov.bc.ca/auth/realms/standard/protocol/openid-connect/auth
      token_url: https://dev.loginproxy.gov.bc.ca/auth/realms/standard/protocol/openid-connect/token
      api_url: https://dev.loginproxy.gov.bc.ca/auth/realms/standard/protocol/openid-connect/userinfo
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

alloy:
  enabled: true
  alloy:
    resources:
      requests:
        cpu: 5m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 256Mi

logStreaming:
  enabled: true

systemLogs:
  enabled: true

backup-storage:
  enabled: true

  image:
    tag: "2.13.0"
    pullPolicy: IfNotPresent

  env:
    S3_BUCKET:
      value: workflow-dev/backups/pgdump/platform/

  backupConfig: |
    postgres=chwf-pgo-replicas:5432/n8n
    postgres=chwf-pgo-replicas:5432/n8n-custom

    */10 * * * * default ./backup.sh -s
    0 7 * * 1-5 default ./backup.sh -s -v all
