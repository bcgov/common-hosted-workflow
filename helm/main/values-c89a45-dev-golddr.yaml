# Enables the DR-failover CronJob (templates/failover/). See the failover:
# block in values.yaml, and values-c89a45-dev-failover.yaml for what changes
# while GoldDR is the active site.
failover:
  enabled: true

n8n:
  enabled: true
  env:
    WEBHOOK_URL: "https://dev-workflow.apps.golddr.devops.gov.bc.ca"
    N8N_SMTP_HOST: "apps.smtp.gov.bc.ca"
    N8N_SMTP_PORT: "25"
    N8N_SMTP_SSL: "false"
    N8N_SMTP_AUTHTYPE: "NONE"
    N8N_SMTP_USER: ""
    N8N_SMTP_PASS: ""
    N8N_SMTP_SENDER: "DoNotReplyCITZ@gov.bc.ca"
    N8N_ENV_FEAT_ENCRYPTION_KEY_ROTATION: "true"
    N8N_BASE_URL: https://dev-workflow.apps.golddr.devops.gov.bc.ca
    OIDC_ISSUER: https://dev.loginproxy.gov.bc.ca/auth/realms/standard
    CHEFS_BASE_URL: https://chefs-dev.apps.silver.devops.gov.bc.ca
    CHEFS_ALLOWED_ORIGINS: "https://chefs-dev.apps.silver.devops.gov.bc.ca,https://chefs-test.apps.silver.devops.gov.bc.ca,https://submit.digital.gov.bc.ca"
    FEATURES_ENABLED: "wil, project, workflow-share, tenant-project-sync"
    CSTAR_BASE_URL: https://dev.connect.digital.gov.bc.ca
    AUTHZ_ENVIRONMENT: dev
    N8N_LICENSE_AUTO_RENEW_ENABLED: "true"
    N8N_EXTERNAL_STORAGE_S3_BUCKET_NAME: "workflow-dev"

  extraExcludedNodes:
    - "n8n-nodes-base.scheduleTrigger"
    - "n8n-nodes-base.rabbitmqTrigger"
    - "n8n-nodes-base.mqttTrigger"
    - "n8n-nodes-base.amqpTrigger"
    - "n8n-nodes-base.kafkaTrigger"
    - "n8n-nodes-base.redisTrigger"
    - "n8n-nodes-base.emailReadImap"
    - "n8n-nodes-base.rssFeedReadTrigger"
    - "n8n-nodes-base.sseTrigger"
    - "n8n-nodes-base.postgresTrigger"

  route:
    enabled: true
    host: dev-workflow.apps.golddr.devops.gov.bc.ca
    # Required when main runs multiple replicas with multi-main enabled.
    # Sticky sessions keep requests from switching between main pods.
    sessionAffinity: true

  main:
    # Multi-main allows main to run multiple replicas.
    env:
      N8N_MULTI_MAIN_SETUP_ENABLED: "true"

  worker:
    enabled: true

  webhook:
    enabled: true

  runner:
    enabled: true

postgresql:
  enabled: false

redis:
  enabled: true

pgo:
  enabled: true
  instance:
    dataVolumeClaimSpec:
      resources:
        requests:
          storage: 1.5Gi
  pgBackRest:
  conditionalRestore:
    enabled: true
    s3:
      bucket: workflow-dev/backups/pgdump/platform

# backup-storage is intentionally disabled on GoldDR — backups are created on Gold only
backup-storage:
  enabled: false

dns-probe:
  enabled: true
  env:
    APP_ENV: "dev"
