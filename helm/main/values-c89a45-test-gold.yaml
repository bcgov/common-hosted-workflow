n8n:
  enabled: true
  env:
    WEBHOOK_URL: "https://test-workflow.apps.gold.devops.gov.bc.ca"
    N8N_SMTP_HOST: "apps.smtp.gov.bc.ca"
    N8N_SMTP_PORT: "25"
    N8N_SMTP_SSL: "false"
    N8N_SMTP_AUTHTYPE: "NONE"
    N8N_SMTP_USER: ""
    N8N_SMTP_PASS: ""
    N8N_SMTP_SENDER: "DoNotReplyCITZ@gov.bc.ca"
    N8N_ENV_FEAT_ENCRYPTION_KEY_ROTATION: "true"
    N8N_BASE_URL: https://test-workflow.apps.gold.devops.gov.bc.ca
    OIDC_ISSUER: https://test.loginproxy.gov.bc.ca/auth/realms/standard
    CHEFS_BASE_URL: https://chefs-test.apps.silver.devops.gov.bc.ca
    CSTAR_BASE_URL: https://test.connect.digital.gov.bc.ca
    FEATURES_ENABLED: "wil, project, workflow-share, tenant-project-sync"
    AUTHZ_ENVIRONMENT: test
    N8N_EXTERNAL_STORAGE_S3_BUCKET_NAME: "workflow-test"

  route:
    enabled: true
    host: test-workflow.apps.gold.devops.gov.bc.ca

  worker:
    enabled: true

  webhook:
    enabled: true

  runner:
    enabled: true

redis:
  enabled: true

pgo:
  enabled: true
  pgBackRest:
    repos:
      - name: repo1
        retention:
          full: "2"
          fullType: count
        volume:
          volumeClaimSpec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 512Mi
            storageClassName: netapp-file-standard
        schedules:
          full: 0 8 * * *
          incremental: 0 0,4,12,16,20 * * *

      - name: repo2
        secretName: chwf-pgo-s3 # pragma: allowlist secret
        retention:
          full: "30"
          fullType: time
        path: /backups/pgo/platform
        uriStyle: path
        s3:
          bucket: workflow-test
          endpoint: commonservices.objectstore.gov.bc.ca
          region: ca-central-1
        schedules:
          full: "0 7 * * 1-5"             # Environment reset/cleanup at 7:00 AM before work starts (Mon-Fri)
          incremental: "0 9-17/2 * * 1-5" # Fast sync every 2 hours during working hours (Mon-Fri)

loki:
  enabled: false
  loki:
    storage:
      bucketNames:
        chunks: test-loki
        ruler: test-loki-ruler
      s3:
        endpoint: http://chwf-seaweedfs-s3.c89a45-tools.svc.cluster.local:8333
    limits_config:
      retention_period: 720h  # 30 days
  singleBinary:
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

tempo:
  enabled: false
  tempo:
    retention: 720h  # 30 days
    storage:
      trace:
        s3:
          bucket: test-tempo
          endpoint: chwf-seaweedfs-s3.c89a45-tools.svc.cluster.local:8333
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

mimir:
  enabled: false
  storage:
    s3:
      endpoint: chwf-seaweedfs-s3.c89a45-tools.svc.cluster.local:8333
      blocksBucket: test-mimir-blocks
      alertmanagerBucket: test-mimir-alertmanager
      rulerBucket: test-mimir-ruler
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

grafana:
  chwfRoute:
    enabled: true
    host: test-grafana-workflow.apps.gold.devops.gov.bc.ca
  enabled: false
  # Prerequisites: the `chwf-grafana` secret must contain these keys before deploying.
  # Add them with: oc patch secret chwf-grafana -n <namespace> --type=merge \
  #   -p '{"stringData":{"GRAFANA_ALERT_EMAIL_TO":"ops@example.com","GRAFANA_ALERT_EMAIL_WORKFLOWS":"workflows@example.com"}}'
  envValueFrom:
    GRAFANA_ALERT_EMAIL_TO:
      secretKeyRef:
        name: chwf-grafana # pragma: allowlist secret
        key: GRAFANA_ALERT_EMAIL_TO
    GRAFANA_ALERT_EMAIL_WORKFLOWS:
      secretKeyRef:
        name: chwf-grafana # pragma: allowlist secret
        key: GRAFANA_ALERT_EMAIL_WORKFLOWS
  grafana.ini:
    server:
      root_url: https://test-grafana-workflow.apps.gold.devops.gov.bc.ca
    auth.generic_oauth:
      auth_url: https://test.loginproxy.gov.bc.ca/auth/realms/standard/protocol/openid-connect/auth
      token_url: https://test.loginproxy.gov.bc.ca/auth/realms/standard/protocol/openid-connect/token
      api_url: https://test.loginproxy.gov.bc.ca/auth/realms/standard/protocol/openid-connect/userinfo
  resources:
    requests:
      cpu: 10m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

alloy:
  enabled: false
  alloy:
    resources:
      requests:
        cpu: 5m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 256Mi

backup-storage:
  enabled: true

  image:
    tag: "2.13.0"
    pullPolicy: IfNotPresent

  env:
    S3_BUCKET:
      value: workflow-test/backups/pgdump/platform/
